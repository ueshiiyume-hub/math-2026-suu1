<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2次不等式 塗って答える</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=STIX+Two+Text:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
<!-- 2次不等式の 練習アプリ（③-1 練習編 ⑴ と 同じ：2次方程式は 解けて、グラフも かけて いる 状態から スタート）。2026-11-13
     1. 塗る ところ（グラフの 線）と 白丸・黒丸を タップで えらぶ → 判定
     2. 答えを 4択（レベル 3 は 6択）から えらぶ
     問題は 毎回 自動で 作る。まちがえた 形が 多く 出る（形 × 不等号 ごとの 正答率で 重み）。交わる → 接する → 交わらない の 順に 解放 -->
<style>
:root{--paper:#fffdf8;--bg:#fdf6ef;--ink:#3d3a4b;--muted:#8a8597;--line:#e6dfd5;--b-ink:#2f6fb5;--accent:#e0465e;
  --sky:#29a0e0;--tint:#fde9d6;--curve:#444;--axis:#555;--ok:#2e9d5b;--ng:#e0465e;--card:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--paper:#23222b;--bg:#1b1a21;--ink:#ecebf2;--muted:#a29fb0;--line:#3a3846;
  --b-ink:#8ab8f0;--sky:#4db3ec;--tint:#4a3826;--curve:#ddd;--axis:#bbb;--card:#2b2a35} }
:root[data-theme="dark"]{--paper:#23222b;--bg:#1b1a21;--ink:#ecebf2;--muted:#a29fb0;--line:#3a3846;--b-ink:#8ab8f0;--sky:#4db3ec;--tint:#4a3826;--curve:#ddd;--axis:#bbb;--card:#2b2a35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",sans-serif}
.math,.mx{font-family:"STIX Two Text",serif}
.mx i{font-style:italic}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));gap:8px}
header{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;color:var(--muted);flex:none}
header b{color:var(--ink);font-size:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.lv{color:#fff;background:var(--b-ink);border-color:var(--b-ink);font-weight:900}
.sp{flex:1}
.ib{border:none;background:none;color:var(--muted);font:inherit;font-size:12px;padding:4px 4px;cursor:pointer;white-space:nowrap}
.forms{display:flex;gap:6px;flex:none}
.form{flex:1;font-size:12px;text-align:center;border-radius:8px;padding:3px 0;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.form .bar{height:4px;border-radius:2px;background:var(--line);margin:3px 8px 0;overflow:hidden}
.form .bar i{display:block;height:100%;background:var(--sky)}
.form.lock{opacity:.45}
.card{background:var(--paper);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px 8px}
.q{font-size:clamp(26px,8vw,36px);text-align:center;white-space:nowrap;line-height:1.2}
.sg{display:inline-block;padding:0 8px;border-radius:8px;background:#fff3c4;border:2px solid var(--accent);color:var(--accent)}
.sol{font-size:14px;text-align:center;color:var(--muted);margin-top:2px}
.gwrap{flex:1;min-height:0;position:relative;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:manipulation}
.tint{fill:var(--tint)}
.ax{stroke:var(--axis);stroke-width:2.2}
.axh{fill:var(--axis)}
.cv{fill:none;stroke:var(--curve);stroke-width:3}
.seg{fill:none;stroke:var(--sky);stroke-width:13;stroke-linecap:round;opacity:0;transition:opacity .15s}
.seg.on{opacity:.62}
.hit{fill:none;stroke:transparent;stroke-width:38;stroke-linecap:round;cursor:pointer}
.segc{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:3 7;stroke-linecap:round}
.dot{stroke-width:3.2;cursor:pointer}
.dot.q{fill:var(--paper);stroke:var(--muted);stroke-dasharray:3 3}
.dot.w{fill:var(--paper);stroke:var(--sky)}
.dot.b{fill:var(--sky);stroke:var(--sky)}
.dhit{fill:transparent;cursor:pointer}
.qm{font:900 12px "Zen Maru Gothic";fill:var(--muted);pointer-events:none}
.num{font:700 20px "STIX Two Text",serif;fill:var(--ink)}
.xl{font:italic 700 18px "STIX Two Text",serif;fill:var(--axis)}
.axp{stroke:#ffb000;stroke-opacity:.55;stroke-width:12;stroke-linecap:round}
.msg{flex:none;min-height:44px;font-size:15px;line-height:1.45;text-align:center;padding:2px 4px}
.msg b{color:var(--b-ink)}
.msg .ok{color:var(--ok);font-weight:900;font-size:18px}
.msg .ng{color:var(--ng);font-weight:900;font-size:18px}
.ctl{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:none;border-radius:12px;padding:12px 8px;font:900 17px "Zen Maru Gothic",sans-serif;background:var(--card);color:var(--ink);border:2px solid var(--line);cursor:pointer;min-height:52px}
.btn.main{background:var(--b-ink);border-color:var(--b-ink);color:#fff}
.btn.on{border-color:var(--sky);background:#e6f4fc;color:#1d6f9e}
.btn.full{grid-column:1/-1}
.btn.small{font-size:13px;white-space:nowrap}
.opt{font:700 18px "STIX Two Text",serif;text-align:center;white-space:nowrap;padding-left:2px;padding-right:2px}
.opt .ja{font:900 16px "Zen Maru Gothic",sans-serif}
.opt.right{border-color:var(--ok);background:#e3f6ea;color:#1e6b3e}
.opt.wrong{border-color:var(--ng);background:#fde3e8;color:#a3243b}
.gap{margin:0 .4em}
.btn:disabled{opacity:.6}
@media (max-height:700px){ .q{font-size:24px} .btn{min-height:44px;padding:8px} .msg{font-size:13px;min-height:38px} }
@media (max-width:380px){ .opt{font-size:16px} .chip{padding:2px 7px} .ib{font-size:16px} }
</style>
</head>
<body>
<div id="app">
  <header><b>2次不等式</b><span class="chip" id="sc">0 / 0</span><span class="chip" id="st">連続 0</span><span class="chip lv" id="lv">レベル 1</span><span class="sp"></span><button class="ib" id="th" aria-label="明るさ">🌙</button><button class="ib" id="rs" aria-label="はじめから">↺</button></header>
  <div class="forms" id="forms"></div>
  <div class="card">
    <div class="q math" id="q"></div>
    <div class="sol" id="sol"></div>
    <div class="gwrap"><svg id="g" viewBox="0 0 360 250" preserveAspectRatio="xMidYMid meet" aria-label="グラフ"></svg></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="ctl" id="ctl"></div>
</div>
<script>
/* ===== 状態（正答率は ブラウザに 覚える。だめでも 動く） ===== */
const FORMS = ['two','touch','none'], FN = {two:'2点で 交わる', touch:'接する', none:'交わらない'};
const SIG = ['＞','＜','≧','≦'];
let S = {n:0, ok:0, streak:0, level:1, unlocked:1, cell:{}, hist:{two:[],touch:[],none:[]}, last:null, lastWrong:false};
try { const s = JSON.parse(localStorage.getItem('ineq_app_v1') || 'null'); if(s && s.cell) S = Object.assign(S, s); } catch(e) {}
const save = () => { try { localStorage.setItem('ineq_app_v1', JSON.stringify(S)); } catch(e) {} };
const acc = k => S.cell[k] ?? 0.5;

/* ===== 問題を 作る ===== */
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const neg = n => n < 0 ? '−' + (-n) : '' + n;
function poly(b, c){   // x² + bx + c を 表示
  let s = 'x²';
  if(b) s += (b > 0 ? ' ＋ ' : ' − ') + (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'x';
  if(c) s += (c > 0 ? ' ＋ ' : ' − ') + Math.abs(c);
  return s;
}
function pickCell(){
  const forms = FORMS.slice(0, S.unlocked);
  if(S.lastWrong && S.last && Math.random() < 0.5) return S.last;      // まちがえた 形を もう一度（数は かえる）
  const cells = [];
  forms.forEach(f => SIG.forEach((_, s) => { const k = f + s; if(k !== S.last) cells.push([k, 0.3 + (1 - acc(k))]); }));
  let r = Math.random() * cells.reduce((t,c)=>t+c[1],0);
  for(const [k,w] of cells){ if((r -= w) <= 0) return k; }
  return cells[0][0];
}
function makeQ(){
  const key = pickCell(), form = key.replace(/\d/,''), s = +key.slice(-1);
  const R = S.level === 1 ? 4 : S.level === 2 ? 6 : 8;
  let roots, b, c, sol;
  if(form === 'two'){
    let a, d; do { a = ri(-R, R-1); d = ri(1, S.level === 1 ? 4 : 7); } while(a + d > R);
    roots = [a, a + d]; b = -(roots[0] + roots[1]); c = roots[0] * roots[1];
    sol = `x ＝ ${neg(roots[0])}, ${neg(roots[1])}`;
  } else if(form === 'touch'){
    const r = ri(-R+1, R-1) || 1; roots = [r]; b = -2*r; c = r*r; sol = `x ＝ ${neg(r)}（重解）`;
  } else {
    const m = ri(-3, 3), k = ri(1, 5); roots = []; b = -2*m; c = m*m + k; sol = '解なし（x軸と 交わらない）';
  }
  return {key, form, s, roots, f:poly(b, c), sol, up: s % 2 === 0, eq: s >= 2};
}

/* ===== グラフ ===== */
const W = 360, f1 = n => n.toFixed(1);
function geom(Q){
  if(Q.form === 'two'){ const ay = 120, r1 = 118, r2 = 242, k = 66 / 62**2;
    return {ay, X:[r1, r2], y: X => ay - k*(X - r1)*(X - r2), x0: 180 - 104, x1: 180 + 104}; }
  if(Q.form === 'touch'){ const ay = 205, k = 0.025; return {ay, X:[180], y: X => ay - k*(X-180)**2, x0: 180 - 92, x1: 180 + 92}; }
  const ay = 225, k = 0.022, v = ay - 48; return {ay, X:[], y: X => v - k*(X-180)**2, x0: 180 - 86, x1: 180 + 86};
}
const path = (G, a, b) => { let d = ''; for(let i=0;i<=40;i++){ const X = a + (b-a)*i/40; d += (i?'L':'M') + f1(X) + ' ' + f1(G.y(X)) + ' '; } return d; };
function segs(Q, G){
  if(Q.form === 'two') return [['L', G.x0, G.X[0]], ['M', G.X[0], G.X[1]], ['R', G.X[1], G.x1]];
  if(Q.form === 'touch') return [['L', G.x0, 180], ['R', 180, G.x1]];
  return [['A', G.x0, G.x1]];
}
const correctSet = Q => Q.form === 'two' ? (Q.up ? ['L','R'] : ['M']) : (Q.up ? (Q.form === 'touch' ? ['L','R'] : ['A']) : []);

/* ===== 画面 ===== */
const $ = id => document.getElementById(id);
let Q, G, paint, dots, none, phase;
const SX = t => t.replace(/x/g, '<i>x</i>');
function head(){
  $('sc').textContent = `${S.ok} / ${S.n}`; $('st').textContent = `連続 ${S.streak}`; $('lv').textContent = `レベル ${S.level}`;
  $('forms').innerHTML = FORMS.map((f,i) => { const h = S.hist[f] || [], a = h.length ? h.filter(Boolean).length / h.length : 0;
    return `<div class="form${i >= S.unlocked ? ' lock' : ''}">${i >= S.unlocked ? '🔒 ' : ''}${FN[f]}<div class="bar"><i style="width:${Math.round(a*100)}%"></i></div></div>`; }).join('');
}
function draw(show){
  const sg = segs(Q, G), cs = correctSet(Q);
  let h = '';
  if(show) h += Q.up ? `<rect class="tint" x="10" y="4" width="${W-20}" height="${G.ay-4}"/>` : `<rect class="tint" x="10" y="${G.ay}" width="${W-20}" height="${250-G.ay}"/>`;
  h += `<line class="ax" x1="10" y1="${G.ay}" x2="${W-18}" y2="${G.ay}"/><polygon class="axh" points="${W-4},${G.ay} ${W-20},${G.ay-8} ${W-20},${G.ay+8}"/><text class="xl" x="${W-24}" y="${G.ay+30}">x</text>`;
  if(show && Q.eq && Q.roots.length) h += `<line class="axp" x1="14" y1="${G.ay}" x2="${W-22}" y2="${G.ay}"/>`;
  h += `<path class="cv" d="${path(G, G.x0, G.x1)}"/>`;
  sg.forEach(([id,a,b]) => { h += `<path class="seg${paint.has(id) ? ' on' : ''}" d="${path(G, a, b)}"/>`; });
  if(show && phase === 'judged') sg.forEach(([id,a,b]) => { if(cs.includes(id) !== paint.has(id) && cs.includes(id)) h += `<path class="segc" d="${path(G, a, b)}"/>`; });
  if(phase === 'paint') sg.forEach(([id,a,b]) => { h += `<path class="hit" data-seg="${id}" d="${path(G, a + (b-a)*0.06, b - (b-a)*0.06)}"/>`; });
  G.X.forEach((X, i) => {
    const r = Q.roots[i], st = dots[i];
    h += `<text class="num" x="${f1(X + (G.X.length > 1 ? (i ? 22 : -22) : 0))}" y="${G.ay + 30}" text-anchor="middle">${neg(r)}</text>`;
    h += `<circle class="dot ${st || 'q'}" cx="${X}" cy="${G.ay}" r="11"/>${st ? '' : `<text class="qm" x="${X}" y="${G.ay+4}" text-anchor="middle">?</text>`}`;
    if(phase === 'paint') h += `<circle class="dhit" data-dot="${i}" cx="${X}" cy="${G.ay}" r="24"/>`;
  });
  $('g').innerHTML = h;
}
function newQ(){
  Q = makeQ(); G = geom(Q); paint = new Set(); dots = Q.roots.map(() => null); none = false; phase = 'paint';
  $('q').innerHTML = `${SX(Q.f)} <span class="sg">${SIG[Q.s]} 0</span>`;
  $('sol').innerHTML = `${SX(Q.f)} ＝ 0 → <span class="mx">${SX(Q.sol)}</span>`;
  draw(false); head();
  $('msg').innerHTML = `<b>塗る ところ</b>（グラフの 線）を タップ。${Q.roots.length ? '<br>点は タップで <b>白丸</b> ／ <b>黒丸</b>。' : ''}`;
  $('ctl').innerHTML = `<button class="btn small" id="nb">塗れる ところが ない</button><button class="btn main" id="jb">判定</button>`;
  $('nb').onclick = () => { none = !none; if(none) paint.clear(); $('nb').classList.toggle('on', none); draw(false); };
  $('jb').onclick = judge;
}
$('g').addEventListener('click', e => {
  if(phase !== 'paint') return;
  const s = e.target.dataset.seg, d = e.target.dataset.dot;
  if(s){ paint.has(s) ? paint.delete(s) : paint.add(s); if(paint.size){ none = false; $('nb') && $('nb').classList.remove('on'); } draw(false); }
  if(d !== undefined){ const i = +d; dots[i] = dots[i] === 'w' ? 'b' : 'w'; draw(false); }
});

const ruleText = () => `${SIG[Q.s]} 0 → <b>${Q.up ? '上' : '下'}${Q.eq ? ' と x軸' : ''}を 塗る</b>。` +
  (Q.roots.length ? (Q.eq ? '　＝ が ある → x軸も 塗る（<b>黒丸</b>）。' : '　＝ が ない → x軸は 塗らない（<b>白丸</b>）。') : '');
let firstOk;
function judge(){
  if(!paint.size && !none){ $('msg').innerHTML = '塗る ところを タップ。　ない ときは「塗れる ところが ない」。'; return; }
  if(dots.some(v => !v)){ $('msg').innerHTML = '点（？）を タップして、<b>白丸</b> か <b>黒丸</b> に しよう。'; return; }
  const cs = correctSet(Q), okPaint = cs.length === paint.size && cs.every(id => paint.has(id));
  const okDot = dots.every(v => v === (Q.eq ? 'b' : 'w'));
  firstOk = okPaint && okDot;
  phase = 'judged';
  if(!firstOk){ paint = new Set(cs); dots = dots.map(() => Q.eq ? 'b' : 'w'); }
  draw(true);
  $('msg').innerHTML = (firstOk ? '<span class="ok">○ 正解！</span>　' : '<span class="ng">× ざんねん</span>　') + ruleText()
    + (!cs.length ? '<br>…でも 塗れる ところが ない。' : '');
  $('ctl').innerHTML = `<button class="btn main full" id="ab">答えを えらぶ</button>`;
  $('ab').onclick = answer;
}

/* ===== 答えの 選択肢 ===== */
function options(){
  const r = Q.roots.map(neg), six = S.level >= 3;
  const J = t => `<span class="ja">${t}</span>`, C = '<span class="gap">,</span>';
  let L = [], ans;
  if(Q.form === 'two'){
    const [a,b] = r, out = [`x ＜ ${a}${C}${b} ＜ x`, `x ≦ ${a}${C}${b} ≦ x`], inn = [`${a} ＜ x ＜ ${b}`, `${a} ≦ x ≦ ${b}`];
    L = [out[0], inn[0], out[1], inn[1]];
    ans = Q.up ? out[+Q.eq] : inn[+Q.eq];
    if(six){ const lt = Q.eq ? '≦' : '＜'; L.push(...(Q.up ? [`x ${lt} ${a}`, `${b} ${lt} x`] : [`${a} ${lt} x`, `x ${lt} ${b}`])); }
  } else if(Q.form === 'touch'){
    const a = r[0], all = J('すべての実数'), no = J('解なし'), eqA = `x ＝ ${a}`, exc = J(`${a}以外の すべての実数`);
    L = [all, no, eqA, exc];
    ans = [exc, no, all, eqA][Q.s];
    if(six) L.push(`x ＜ ${a}`, `${a} ＜ x`);
  } else {
    const all = J('すべての実数'), no = J('解なし');
    L = [all, no, 'x ＞ 0', 'x ＜ 0'];
    ans = Q.up ? all : no;
    if(six) L.push('x ≧ 0', 'x ≦ 0');
  }
  for(let i = L.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [L[i], L[j]] = [L[j], L[i]]; }
  return {L, ans};
}
function answer(){
  phase = 'answer';
  const {L, ans} = options();
  $('msg').innerHTML = '塗れた ところを 見て、<b>答え</b> を えらぼう。';
  $('ctl').innerHTML = L.map((t,i) => `<button class="btn opt" data-i="${i}">${SX(t).replace(/<span class="ja">([^<]*)<\/span>/g, (m, s) => `<span class="ja">${s.replace(/<\/?i>/g,'')}</span>`)}</button>`).join('');
  [...$('ctl').children].forEach((bt, i) => bt.onclick = () => {
    if(phase !== 'answer') return;
    phase = 'done';
    const ok = L[i] === ans;
    [...$('ctl').children].forEach((x, j) => { if(L[j] === ans) x.classList.add('right'); else if(j === i) x.classList.add('wrong'); x.disabled = true; });
    finish(ok);
  });
}
function finish(ok2){
  const ok = firstOk && ok2, k = Q.key;
  S.n++; if(ok) S.ok++;
  S.streak = ok ? S.streak + 1 : 0;
  S.cell[k] = 0.65 * acc(k) + 0.35 * (ok ? 1 : 0);
  (S.hist[Q.form] = (S.hist[Q.form] || []).concat(ok ? 1 : 0)).splice(0, Math.max(0, S.hist[Q.form].length - 8));
  S.last = k; S.lastWrong = !ok;
  // 形の 解放：今 いちばん 新しい 形を 6問 以上 やって 直近 8問の 75% 以上 → 次の 形
  const top = FORMS[S.unlocked - 1], h = S.hist[top];
  if(S.unlocked < 3 && h.length >= 6 && h.filter(Boolean).length / h.length >= 0.75){ S.unlocked++; S.hist[FORMS[S.unlocked-1]] = []; var unlockMsg = `🔓「${FN[FORMS[S.unlocked-1]]}」が 出る ように なった！`; }
  // レベル：5問 連続 正解で 上がる（数の はばが 広く、レベル 3 は 6択）、2問 つづけて まちがえると 下がる
  if(S.streak && S.streak % 5 === 0 && S.level < 3){ S.level++; var lvMsg = `⬆ レベル ${S.level}！`; }
  if(!ok){ S.miss = (S.miss || 0) + 1; if(S.miss >= 2 && S.level > 1){ S.level--; S.miss = 0; } } else S.miss = 0;
  save(); head();
  $('msg').innerHTML = (ok2 ? '<span class="ok">○ 正解！</span>' : '<span class="ng">× 答えは 緑の ところ</span>')
    + ([unlockMsg, lvMsg].filter(Boolean).length ? '<br>' + [unlockMsg, lvMsg].filter(Boolean).join('　') : '');
  const nx = document.createElement('button'); nx.className = 'btn main full'; nx.textContent = 'つぎの 問題 →'; nx.onclick = newQ;
  $('ctl').appendChild(nx);
}
$('rs').onclick = () => { if(confirm('記録を 消して、はじめから に しますか？')){ try { localStorage.removeItem('ineq_app_v1'); } catch(e) {} location.reload(); } };
$('th').onclick = () => { const r = document.documentElement, d = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = d ? 'light' : 'dark'; };
newQ();
</script>
</body>
</html>
