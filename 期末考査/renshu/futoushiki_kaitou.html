<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.num{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;background:var(--blue);color:#fff;font-size:26px;font-weight:700}
header h1{font-size:17px;margin:0;flex:1;min-width:180px}
@media (max-width:480px){header h1{font-size:15px}.num{width:34px;height:34px;font-size:22px}}
header h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.all{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--blue);background:var(--paper);color:var(--blue);border-radius:8px;padding:6px 12px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:14px 16px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.note{grid-column:1/-1;margin:0;color:var(--muted);font-size:14px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px 14px}
.eq{display:flex;align-items:baseline;gap:10px;font-size:21px;font-weight:700}
.no{font-size:18px}
.m i{font-family:"Times New Roman",serif;font-weight:400;font-size:1.08em}
.rt{white-space:nowrap}.rb{border-top:1.5px solid currentColor;padding:0 1px}
.g{display:block;width:100%;max-width:260px;margin:4px auto 6px}
.ax{stroke:var(--ink);stroke-width:1.6}.xl{font:italic 17px "Times New Roman",serif;fill:var(--ink)}
.cv{fill:none;stroke:var(--cv);stroke-width:2.4}
.pa{fill:none;stroke:var(--paint);stroke-width:9;stroke-opacity:.75;stroke-linecap:round}
.bd{fill:var(--paint);stroke:var(--paint);stroke-width:2}.wd{fill:#fff;stroke:var(--paint);stroke-width:2.6}
.lb{font:17px "Times New Roman",serif;fill:var(--ink)}
.vb{stroke:var(--ink);stroke-width:1.2}
.pt{opacity:0;transition:opacity .25s}.q.open .pt{opacity:1}
.ans{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:var(--btn);border:2px dashed #c97a1f;border-radius:8px;cursor:pointer;padding:6px}
.ans .av{display:none}.ans .qm{color:var(--btnc);font-size:24px}
.q.open .ans{border-style:solid;border-color:var(--line);background:var(--paper)}
.q.open .ans .av{display:inline}.q.open .ans .qm{display:none}
.gap{display:inline-block;width:.8em}
</style></head><body>
