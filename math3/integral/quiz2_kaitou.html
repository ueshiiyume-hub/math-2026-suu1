<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>小テスト② 解答</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{--bg:#eef2f8;--paper:#fff;--ink:#2b3340;--muted:#687385;--line:#c5d6ec;--main:#8fb4e0;--deep:#2f5f9e;--pale:#eaf1fa;--a:#c8642a;--b:#8a4fb0;--btn:#f4f8fd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151920;--paper:#222833;--ink:#e6ebf2;--muted:#a3adbd;--line:#3d4a5e;--main:#7fa6d6;--deep:#a9c8f0;--pale:#2a3444;--a:#f2a775;--b:#cfa2ec;--btn:#273041}}
:root[data-theme="dark"]{--bg:#151920;--paper:#222833;--ink:#e6ebf2;--muted:#a3adbd;--line:#3d4a5e;--main:#7fa6d6;--deep:#a9c8f0;--pale:#2a3444;--a:#f2a775;--b:#cfa2ec;--btn:#273041}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.num{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--deep);color:#fff;font-size:26px;font-weight:700}
header h1{font-size:17px;margin:0;flex:1;min-width:180px}
header h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.all{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--deep);background:var(--paper);color:var(--deep);padding:6px 12px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px 16px 48px;display:grid;gap:14px}
.note{margin:0;color:var(--muted);font-size:14px}
.q{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--main);padding:12px 16px 16px}
.eq{display:flex;align-items:center;gap:12px;font-size:20px;margin-bottom:10px;overflow-x:auto}
.no{font-size:19px;font-weight:700;color:var(--deep)}
.ans{display:block;width:100%;font:inherit;color:var(--ink);background:var(--btn);border:2px dashed var(--main);cursor:pointer;padding:10px;text-align:left;min-height:56px}
.ans .qm{display:block;text-align:center;color:var(--deep);font-size:26px;font-weight:700}
.ans .av{display:none}
.q.open .ans{border-style:solid;border-color:var(--line);background:var(--paper);cursor:default}
.q.open .ans .qm{display:none}.q.open .ans .av{display:block}
.sel{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:15px;margin-bottom:8px}
.sel .fd,.sel .gd{font-weight:700;padding:2px 8px;color:#fff}
.sel .fd{background:var(--a)}.sel .gd{background:var(--b)}
.sel .pr{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;margin-right:14px}
.sel .k{font-size:19px}
.calc{display:flex;flex-direction:column;gap:6px;font-size:18px;overflow-x:auto;padding:4px 0}
.fin{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 12px;background:var(--pale);border:1px solid var(--line);font-size:19px;overflow-x:auto}
.fin .fl{font-size:14px;font-weight:700;color:var(--deep);white-space:nowrap}
.fin .k{color:var(--deep)}
.calc .katex,.fin .katex,.eq .katex{white-space:nowrap}
@media (max-width:480px){.calc{font-size:15px}.fin{font-size:15.5px}.eq{font-size:18px}}
</style></head><body>
<header><span class="num">②</span><h1><small>数学Ⅲ　積分法</small>小テスト②（部分積分）　解答</h1><button class="all" type="button" id="all">全部の答えを見る</button></header>
<main><p class="note">「？」をタップすると、微分する方・積分する方と計算、答えが出ます（もう一度タップでかくす）。</p>
<section class="q"><div class="eq"><span class="no">⑴</span><span class="k d" data-tex="\int x\cos2x\,dx"></span></div>
  <button class="ans" type="button" aria-label="⑴ の 解き方と 答えを 見る"><span class="qm">？</span>
  <span class="av"><span class="sel"><span class="pr"><span class="fd">微分する方</span><span class="k" data-tex="x"></span></span><span class="pr"><span class="gd">積分する方</span><span class="k" data-tex="\cos2x"></span></span></span>
  <span class="calc"><span class="ln"><span class="k d" data-tex="\int x\cos2x\,dx"></span></span><span class="ln"><span class="k d" data-tex="=x\cdot\frac{1}{2}\sin2x-\int 1\cdot\frac{1}{2}\sin2x\,dx"></span></span><span class="ln"><span class="k d" data-tex="=\frac{1}{2}x\sin2x-\frac{1}{2}\int \sin2x\,dx"></span></span><span class="ln"><span class="k d" data-tex="=\frac{1}{2}x\sin2x+\frac{1}{4}\cos2x+C"></span></span></span>
  <span class="fin"><span class="fl">答え</span><span class="k d" data-tex="\frac{1}{2}x\sin2x+\frac{1}{4}\cos2x+C"></span></span></span></button></section>
<section class="q"><div class="eq"><span class="no">⑵</span><span class="k d" data-tex="\int (x+2)e^x\,dx"></span></div>
  <button class="ans" type="button" aria-label="⑵ の 解き方と 答えを 見る"><span class="qm">？</span>
  <span class="av"><span class="sel"><span class="pr"><span class="fd">微分する方</span><span class="k" data-tex="x+2"></span></span><span class="pr"><span class="gd">積分する方</span><span class="k" data-tex="e^x"></span></span></span>
  <span class="calc"><span class="ln"><span class="k d" data-tex="\int (x+2)e^x\,dx"></span></span><span class="ln"><span class="k d" data-tex="=(x+2)e^x-\int 1\cdot e^x\,dx"></span></span><span class="ln"><span class="k d" data-tex="=(x+2)e^x-e^x+C"></span></span><span class="ln"><span class="k d" data-tex="=(x+1)e^x+C"></span></span></span>
  <span class="fin"><span class="fl">答え</span><span class="k d" data-tex="(x+1)e^x+C"></span></span></span></button></section>
<section class="q"><div class="eq"><span class="no">⑶</span><span class="k d" data-tex="\int x^2\log x\,dx"></span></div>
  <button class="ans" type="button" aria-label="⑶ の 解き方と 答えを 見る"><span class="qm">？</span>
  <span class="av"><span class="sel"><span class="pr"><span class="fd">微分する方</span><span class="k" data-tex="\log x"></span></span><span class="pr"><span class="gd">積分する方</span><span class="k" data-tex="x^2"></span></span></span>
  <span class="calc"><span class="ln"><span class="k d" data-tex="\int x^2\log x\,dx"></span></span><span class="ln"><span class="k d" data-tex="=\frac{1}{3}x^3\log x-\int \frac{1}{x}\cdot\frac{1}{3}x^3\,dx"></span></span><span class="ln"><span class="k d" data-tex="=\frac{1}{3}x^3\log x-\frac{1}{3}\int x^2\,dx"></span></span><span class="ln"><span class="k d" data-tex="=\frac{1}{3}x^3\log x-\frac{1}{9}x^3+C"></span></span></span>
  <span class="fin"><span class="fl">答え</span><span class="k d" data-tex="\frac{1}{3}x^3\log x-\frac{1}{9}x^3+C"></span></span></span></button></section>
</main>
<script>
document.querySelectorAll('.k').forEach(e=>{try{katex.render((e.classList.contains('d')?'\\displaystyle ':'')+e.dataset.tex,e,{displayMode:false,throwOnError:false});}catch(_){e.textContent=e.dataset.tex;}});
const qs=[...document.querySelectorAll('.q')], all=document.getElementById('all');
qs.forEach(q=>q.querySelector('.ans').addEventListener('click',()=>{q.classList.toggle('open');sync();}));
function sync(){all.textContent=qs.every(q=>q.classList.contains('open'))?'全部かくす':'全部の答えを見る';}
all.addEventListener('click',()=>{const o=!qs.every(q=>q.classList.contains('open'));qs.forEach(q=>q.classList.toggle('open',o));sync();});
</script></body></html>
